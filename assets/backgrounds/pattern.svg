<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="200"
     height="200"
     viewBox="0 0 200 200">

    <defs>
        <pattern id="dots"
                 width="20"
                 height="20"
                 patternUnits="userSpaceOnUse">

            <circle
                cx="2"
                cy="2"
                r="1"
                fill="#30363D"
                opacity="0.35"/>

        </pattern>
    </defs>

    <rect
        width="200"
        height="200"
        fill="url(#dots)"/>

</svg>
